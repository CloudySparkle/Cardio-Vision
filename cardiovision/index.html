<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseVision 3D | CardioVision AI Clinical Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050906] text-[#edf6ef] antialiased selection:bg-[#70f0a0]/30 selection:text-[#70f0a0]">
    <canvas id="ambient-canvas" aria-hidden="true"></canvas>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Ambient canvas particles & cursor glow from reference UI
      (function() {
        const glow = document.querySelector('.cursor-glow');
        if (glow) {
          window.addEventListener('pointermove', function(e) {
            document.documentElement.style.setProperty('--mx', e.clientX + 'px');
            document.documentElement.style.setProperty('--my', e.clientY + 'px');
            glow.classList.add('visible');
          });
          window.addEventListener('pointerleave', function() {
            glow.classList.remove('visible');
          });
        }

        const canvas = document.getElementById('ambient-canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          if (ctx) {
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            window.addEventListener('resize', function() {
              w = canvas.width = window.innerWidth;
              h = canvas.height = window.innerHeight;
            });
            const particles = [];
            for (let i = 0; i < 45; i++) {
              particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.5 + 0.5,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3 - 0.15,
                alpha: Math.random() * 0.4 + 0.1
              });
            }
            function draw() {
              ctx.clearRect(0, 0, w, h);
              for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(112, 240, 160, ' + p.alpha + ')';
                ctx.fill();
              }
              requestAnimationFrame(draw);
            }
            draw();
          }
        }
      })();
    </script>
  </body>
</html>
